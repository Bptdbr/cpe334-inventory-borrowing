# Local run: PostgreSQL + one-shot migration/seed + application.
# Usage: cp .env.example .env  (set SEED_DEMO_PASSWORD to any local value), then:
#   docker compose up --build
# The database credentials below are throwaway values for local use only.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: inventory
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d inventory"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build: .
    command: ["sh", "-c", "npm run db:migrate --workspace=backend && npm run db:seed --workspace=backend"]
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/inventory?schema=public
      JWT_SECRET: ${JWT_SECRET}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD}
    depends_on:
      db:
        condition: service_healthy

  app:
    build: .
    ports:
      - "${PORT:-3000}:3000"
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/inventory?schema=public
      JWT_SECRET: ${JWT_SECRET}
    depends_on:
      migrate:
        condition: service_completed_successfully

volumes:
  pgdata:
